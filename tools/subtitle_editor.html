<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>39ra Garden Radio — 汎用字幕レビュー</title>
<style>
:root{color-scheme:dark;--bg:#100d17;--pane:#23192b;--accent:#d6a0b8;--gold:#e0c9a0;--text:#f6e9ed;--sub:#beaebc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -30%,#4c254a 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,"Yu Gothic",sans-serif}header,main,footer{max-width:1250px;margin:auto;padding:18px 22px}h1{font:400 clamp(26px,4vw,40px) Georgia,"Yu Mincho",serif;color:#ffe4ed}h2{font:400 21px Georgia,"Yu Mincho",serif;color:var(--gold)}.muted,small{color:var(--sub)}.banner{border:1px solid #86637f;background:#352439;border-radius:12px;padding:12px 16px;margin:12px 0}.audio{background:var(--pane);padding:17px;border-radius:15px;position:sticky;top:0;z-index:5;box-shadow:0 12px 32px #0008}audio{width:100%;accent-color:var(--accent)}button,input,textarea{font:inherit}button{cursor:pointer;color:var(--text);background:#3b2c40;border:1px solid #765b74;border-radius:7px;padding:7px 10px}button:hover{background:#5e3e58}button.primary{background:#89506a;border-color:#b77794}button:disabled{opacity:.5}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}.stat{padding:4px 10px;background:#1b1320;border:1px solid #584154;border-radius:8px;color:#d9c5cd}#status.bad{color:#ffabab}#status.ok{color:#c4e0b2}.cue{display:grid;grid-template-columns:40px 170px minmax(250px,1fr) 175px;gap:8px;align-items:center;border-bottom:1px solid #4d3b4c;padding:9px 0}.cue.active{background:#4c2b48;border-radius:6px}.idx{color:var(--gold);font-size:12px}.times{display:flex;gap:5px}.times input{width:82px}.cue input,.cue textarea{color:var(--text);background:#201623;border:1px solid #68556d;border-radius:6px;padding:5px 6px;width:100%}.cue textarea{resize:vertical;min-height:43px}.actions{display:flex;flex-wrap:wrap;gap:4px}.actions button{padding:5px 8px}.chapters{display:flex;flex-wrap:wrap;gap:8px}.chapters button{flex:1 1 130px}.hidden{display:none}@media(max-width:860px){header,main{padding:12px}.cue{grid-template-columns:34px 1fr}.cue .textentry,.cue .actions{grid-column:1/-1}.audio{top:0}}
</style>
</head>
<body>
<header><small>NIGHT GARDEN BROADCAST / OFFLINE EDITOR</small><h1>字幕・発話レビュー</h1><p class="muted">JSONと音声をローカルファイルとして選択して確認します。外部通信、Radio本体の更新、公開登録は行いません。</p><div class="banner">reviewed JSONは人間の試聴確認後に保存してください。自動検証のPASSは、ニュースの正確性・権利・聴取承認を意味しません。</div></header>
<main>
<section class="audio"><div class="controls"><label>エピソードJSON <input id="jsonFile" type="file" accept="application/json,.json"></label><label>音声 <input id="audioFile" type="file" accept="audio/*,.mp3,.wav,.m4a"></label></div><audio id="player" controls preload="metadata"></audio><div class="controls"><span id="clock" class="stat">00:00.00 / --:--.--</span><button id="rewind">−2秒</button><button id="forward">＋2秒</button><button id="check">時刻を検証</button><button id="export" class="primary" disabled>reviewed JSONを保存</button><span id="status">JSONと音声を選択してください</span></div><div id="chapters" class="chapters"></div></section>
<section><h2 id="title">字幕キュー</h2><div id="cueList"><p class="muted">JSONファイルを選択するとキューが表示されます。</p></div></section>
<section class="banner"><h2>確認項目</h2><label><input type="checkbox"> 音声を最後まで試聴した</label><br><label><input type="checkbox"> 各字幕の開始・終了と固有名詞を確認した</label><br><label><input type="checkbox"> 章・出典・画像権利を確認した</label><br><label><input type="checkbox"> 非公開プレビューで再確認した</label></section>
</main><footer class="muted">ローカル処理のみ。保存操作を行うまでファイルは書き出されません。</footer>
<script>
'use strict';
let episode=null, jsonName='', audioUrl='', loopUntil=null;
const $=id=>document.getElementById(id), player=$('player'), list=$('cueList'), status=$('status');
function mmss(t){return `${String(Math.floor(t/60)).padStart(2,'0')}:${(t%60).toFixed(2).padStart(5,'0')}`}
function parseTime(v){const m=/^(\d+):([0-5]?\d(?:\.\d{1,3})?)$/.exec(String(v).trim());return m?Number(m[1])*60+Number(m[2]):NaN}
function download(name,data){const u=URL.createObjectURL(new Blob([data],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function segments(){return Array.isArray(episode?.segments)?episode.segments:[]}
function validate(){if(!episode){status.textContent='JSONと音声を選択してください';status.className='';return ['no episode']};const errors=[];let previous=-Infinity;const segs=segments();if(!Array.isArray(episode.lines_timed)||!episode.lines_timed.length)errors.push('lines_timedが空です');for(const [i,c] of (episode.lines_timed||[]).entries()){const part=Number(c.part),s=segs[part];if(!Number.isFinite(c.start)||!Number.isFinite(c.end)||c.start<0||c.end<=c.start||c.end>Number(episode.seconds)+.05)errors.push(`${i+1}: 時刻が不正`);if(c.start<previous-.001)errors.push(`${i+1}: 前の字幕と重複`);if(!s)errors.push(`${i+1}: partが不正`);else if(c.start<s.start-.1||c.end>s.end+.1)errors.push(`${i+1}: 章の範囲外`);if(typeof c.show!=='string'||!c.show.trim())errors.push(`${i+1}: showが空`);previous=c.end}status.textContent=errors.length?`要修正: ${errors.slice(0,3).join(' / ')}`:'時刻・字幕形式: PASS（聴取確認は別）';status.className=errors.length?'bad':'ok';return errors}
function render(){list.innerHTML='';if(!episode)return;const labels=segments().map(s=>String(s.kind||'part').toUpperCase());$('title').textContent=`${episode.title||episode.date||'Episode'} / 字幕キュー（${episode.lines_timed.length}件）`;episode.lines_timed.forEach((c,i)=>{const row=document.createElement('div');row.className='cue';row.dataset.i=i;const ix=document.createElement('div');ix.className='idx';ix.textContent=`${String(i+1).padStart(2,'0')} / ${labels[c.part]||'?'}`;const times=document.createElement('div');times.className='times';for(const [key,label] of [['start','開始'],['end','終了']]){const input=document.createElement('input');input.setAttribute('aria-label',`${i+1} ${label}`);input.value=mmss(c[key]);input.addEventListener('change',()=>{c[key]=parseTime(input.value);validate()});times.append(input)}const text=document.createElement('textarea');text.className='textentry';text.setAttribute('aria-label',`${i+1} 字幕`);text.value=c.show||'';text.addEventListener('input',()=>{c.show=text.value;validate()});const actions=document.createElement('div');actions.className='actions';const play=document.createElement('button');play.textContent='▶ 再生';play.onclick=()=>{player.currentTime=Math.max(0,c.start-.4);player.play()};const loop=document.createElement('button');loop.textContent='↻ 区間';loop.onclick=()=>{player.currentTime=Math.max(0,c.start-.2);loopUntil=c.end+.15;player.play()};actions.append(play,loop);row.append(ix,times,text,actions);list.append(row)});$('chapters').innerHTML='';segments().forEach((s,i)=>{const b=document.createElement('button');b.textContent=`${String(s.kind||'part').toUpperCase()} ${mmss(Number(s.start)||0)}`;b.onclick=()=>{player.currentTime=Number(s.start)||0;player.play()};$('chapters').append(b)});validate()}
function readJson(file){const fr=new FileReader();fr.onload=()=>{try{const parsed=JSON.parse(fr.result);if(!parsed||parsed.format!=='monoradio/news-1'||!Array.isArray(parsed.lines_timed)||!Array.isArray(parsed.segments))throw Error('monoradio/news-1形式ではありません');episode=parsed;jsonName=file.name;render();$('export').disabled=false}catch(e){episode=null;$('export').disabled=true;status.textContent=`読み込み失敗: ${e.message}`;status.className='bad'}};fr.readAsText(file,'utf-8')}
$('jsonFile').onchange=e=>{const f=e.target.files[0];if(f)readJson(f)};$('audioFile').onchange=e=>{const f=e.target.files[0];if(audioUrl)URL.revokeObjectURL(audioUrl);if(f){audioUrl=URL.createObjectURL(f);player.src=audioUrl;player.load()}};$('check').onclick=validate;$('rewind').onclick=()=>player.currentTime=Math.max(0,player.currentTime-2);$('forward').onclick=()=>player.currentTime=Math.min(player.duration||Number.MAX_SAFE_INTEGER,player.currentTime+2);$('export').onclick=()=>{if(validate().length)return;const name=(episode.date||jsonName.replace(/\.json$/i,''))+`-${episode.lang||'ja'}.reviewed.json`;download(name,JSON.stringify(episode,null,2)+'\n')};player.addEventListener('timeupdate',()=>{const t=player.currentTime;$('clock').textContent=`${mmss(t)} / ${mmss(player.duration||episode?.seconds||0)}`;if(loopUntil&&t>=loopUntil){player.pause();loopUntil=null}for(const [i,c] of (episode?.lines_timed||[]).entries())list.children[i]?.classList.toggle('active',t>=c.start&&t<c.end)});
</script>
</body></html>
